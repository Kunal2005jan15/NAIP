name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - name: Lint (new code only)
        run: ruff check pipeline tests/test_weather_features.py tests/test_seed_reference.py
      - name: Format check (new code only)
        run: ruff format --check pipeline tests/test_weather_features.py tests/test_seed_reference.py
      - name: Syntax check (all code)
        run: python -m compileall -q src api dashboard pipeline tests

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-pipeline.txt -r requirements-dev.txt
      - run: pytest -q -rs

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: naip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d naip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists for the length of this job.
      DATABASE_URL_OWNER: postgresql://ci:ci@localhost:5432/naip_ci
      DATABASE_URL_WRITER: postgresql://naip_writer:ci-writer@localhost:5432/naip_ci
      DATABASE_URL_READER: postgresql://naip_reader:ci-reader@localhost:5432/naip_ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install migration dependencies
        run: pip install "alembic>=1.13" "sqlalchemy>=2.0" "psycopg[binary]>=3.1" "python-dotenv>=1.0"
      - name: Create application roles
        run: |
          psql -h localhost -U ci -d naip_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE naip_writer LOGIN PASSWORD 'ci-writer'"
          psql -h localhost -U ci -d naip_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE naip_reader LOGIN PASSWORD 'ci-reader'"
      - name: Migrate up
        run: alembic upgrade head
      - name: Expect 12 tables plus alembic_version
        run: |
          n=$(psql -h localhost -U ci -d naip_ci -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "tables after upgrade: $n"
          test "$n" = "13"
      - name: Check role privileges
        run: python -m pipeline.db.verify_grants
      - name: Migrate down (must be reversible)
        run: alembic downgrade base
      - name: Expect only alembic_version left
        run: |
          n=$(psql -h localhost -U ci -d naip_ci -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "tables after downgrade: $n"
          test "$n" = "1"
      - name: Migrate up again
        run: alembic upgrade head