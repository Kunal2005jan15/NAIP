name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - name: Lint (new code only)
        run: ruff check pipeline tests/test_weather_features.py
      - name: Format check (new code only)
        run: ruff format --check pipeline tests/test_weather_features.py
      - name: Syntax check (all code)
        run: python -m compileall -q src api dashboard pipeline tests

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-pipeline.txt -r requirements-dev.txt
      - run: pytest -q -rs